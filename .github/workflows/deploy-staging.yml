name: Deploy to staging

on:
  push:
    branches: [main, staging, claude/zealous-cori-29laga]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_URL: https://beercheck.spinstaging.com
  # Laravel project root on the server, OUTSIDE public_html.
  # The domain's document root must be APP_DIR/public (cPanel: beercheck.spinstaging.com/public).
  # Override with a repository variable APP_DIR if the path changes.
  APP_DIR: ${{ vars.APP_DIR || '/home/spinwebsites/beercheck.spinstaging.com' }}
  DB_NAME: spinwebsites_beercheck
  DB_USER: spinwebsites_beercheck
  # Staging shows fictional demo venues/prices with a banner. Set to 'false' to stop seeding
  # (existing demo data stays until you run: php artisan app:demo-content --remove).
  BEERCHECK_DEMO: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, pdo_sqlite, zip, bcmath
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare test environment
        run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, bcmath
          coverage: none

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: npm ci && npm run build

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          install -m 700 -d ~/.ssh
          # Normalise the pasted key: strip Windows CRs, per-line indentation and blank lines at the
          # start/end only (encrypted PEM keys need the blank line after their DEK-Info header).
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            | awk 'NF {found=1} found {buf = buf $0 "\n"; if (NF) {printf "%s", buf; buf=""}}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if grep -q 'PuTTY-User-Key-File' ~/.ssh/deploy_key; then
            echo "::error::SSH_KEY is a PuTTY .ppk key. In cPanel > SSH Access > View/Download, copy the OpenSSH private key (starts with -----BEGIN), not the PPK."; exit 1
          fi
          if ! head -1 ~/.ssh/deploy_key | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            echo "::error::SSH_KEY does not start with a -----BEGIN ... PRIVATE KEY----- line. Paste the whole private key, including the BEGIN and END lines."; exit 1
          fi
          echo "Key header: $(head -1 ~/.ssh/deploy_key) ($(wc -l < ~/.ssh/deploy_key) lines)"
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            # Decrypt a passphrase-protected key on the runner only (file is deleted at the end of the job).
            if ! ssh-keygen -p -P "$SSH_KEY_PASSPHRASE" -N '' -f ~/.ssh/deploy_key > /tmp/keygen.log 2>&1; then
              echo "::error::SSH_KEY_PASSPHRASE did not unlock SSH_KEY: $(cat /tmp/keygen.log)"; exit 1
            fi
            echo "Key unlocked with SSH_KEY_PASSPHRASE."
          fi
          if ! ssh-keygen -y -P '' -f ~/.ssh/deploy_key > /dev/null 2> /tmp/keygen.log; then
            if grep -q 'ENCRYPTED' ~/.ssh/deploy_key || grep -qi 'passphrase' /tmp/keygen.log; then
              echo "::error::SSH_KEY is protected by a password. Add it as a repository secret named SSH_KEY_PASSPHRASE (the 'Key Password' you entered when generating the key in cPanel), then re-run."
            else
              echo "::error::SSH_KEY could not be parsed ($(cat /tmp/keygen.log)). Re-copy the private key from cPanel > SSH Access > View/Download."
            fi
            exit 1
          fi
          echo "Key OK: $(ssh-keygen -l -f ~/.ssh/deploy_key)"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<CFG
          Host deploy
            HostName $SSH_HOST
            Port ${SSH_PORT:-22}
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          CFG
          ssh deploy 'echo "Connected as $(whoami) on $(hostname)"'

      - name: Upload release (tar over SSH)
        run: |
          # --anchored: patterns only match at the archive root (vendor/*/tests etc. are kept).
          tar -czf "$RUNNER_TEMP/release.tgz" --anchored \
            --exclude=./.git --exclude=./.github --exclude=./node_modules --exclude=./tests \
            --exclude=./.env --exclude=./storage --exclude=./bootstrap/cache \
            --exclude=./public/storage --exclude=./public/hot \
            --exclude=./phpunit.xml --exclude=./.phpunit.cache \
            -C . .
          echo "Release size: $(du -h "$RUNNER_TEMP/release.tgz" | cut -f1)"
          INCOMING="${APP_DIR}.incoming"
          ssh deploy "rm -rf '$INCOMING' && mkdir -p '$INCOMING' && tar -xzf - -C '$INCOMING'" < "$RUNNER_TEMP/release.tgz"
          ssh deploy "bash '$INCOMING/deploy/cpanel/swap-release.sh' '$INCOMING' '$APP_DIR'"

      - name: Migrate, cache, cron
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          printf '%s\n' "$DB_PASSWORD" | ssh deploy \
            "bash '$APP_DIR/deploy/cpanel/remote-deploy.sh' '$APP_DIR' '$APP_URL' '$DB_NAME' '$DB_USER' '$BEERCHECK_DEMO'"

      - name: Smoke test
        run: |
          fail=0
          for url in "$APP_URL/up" "$APP_URL/"; do
            code=000
            for attempt in 1 2 3; do
              code=$(curl -s -o "$RUNNER_TEMP/body.html" -D "$RUNNER_TEMP/headers.txt" -w '%{http_code}' -L --max-time 30 "$url" || true)
              [ "$code" = "200" ] && break
              sleep 5
            done
            echo "$url -> $code"
            if [ "$code" != "200" ]; then
              fail=1
              echo "--- response headers"; grep -iE '^(HTTP|server|x-powered-by|content-type|location)' "$RUNNER_TEMP/headers.txt" || true
              echo "--- response body (first 15 lines)"; head -c 1500 "$RUNNER_TEMP/body.html" | sed -n '1,15p'; echo
            fi
          done
          if [ "$fail" = 1 ]; then
            echo "--- server-side diagnostics"
            ssh deploy "set +e
              echo 'App dir (should contain artisan, public/index.php):'; ls -1 '$APP_DIR' | head -20
              echo 'Permissions along the path (web server needs x on each dir, r on files):'
              ls -ld \$HOME '$APP_DIR' '$APP_DIR/public'; ls -la '$APP_DIR/public' | head -12
              [ -f '$APP_DIR/.htaccess' ] && { echo 'WARNING: $APP_DIR/.htaccess exists (parent .htaccess rules apply to public/):'; cat '$APP_DIR/.htaccess'; }
              echo 'Old location (should no longer be the document root):'; ls -ld \$HOME/public_html/beercheck.spinstaging.com \$HOME/public_html/beercheck.spinstaging.com/public 2>&1
              echo 'Laravel log tail:'; tail -n 20 '$APP_DIR'/storage/logs/laravel-*.log 2>/dev/null || echo '(no log yet - request never reached Laravel)'"
            echo "::error::Site check failed. If the body above is a generic Apache/LiteSpeed 404 and there is no Laravel log, the domain's Document Root is not pointing at $APP_DIR/public (cPanel > Domains > Manage)."
            exit 1
          fi

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/keygen.log
